<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Station Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        
        /* Animated Sun */
        @keyframes sunPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 60px rgba(255, 200, 50, 0.6); }
            50% { transform: scale(1.1); box-shadow: 0 0 100px rgba(255, 200, 50, 0.8); }
        }
        
        @keyframes sunRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .sun-container {
            animation: sunPulse 4s ease-in-out infinite;
        }
        
        .sun-rays {
            animation: sunRotate 20s linear infinite;
        }
        
        /* Animated Clouds */
        @keyframes float {
            0%, 100% { transform: translateX(-100px) translateY(0px); }
            25% { transform: translateX(0px) translateY(-20px); }
            50% { transform: translateX(100px) translateY(0px); }
            75% { transform: translateX(0px) translateY(20px); }
        }
        
        @keyframes drift {
            from { transform: translateX(-200px); }
            to { transform: translateX(calc(100vw + 200px)); }
        }
        
        .cloud {
            animation: drift 25s linear infinite;
        }
        
        .cloud:nth-child(2) { animation-duration: 35s; animation-delay: -5s; }
        .cloud:nth-child(3) { animation-duration: 30s; animation-delay: -10s; }
        .cloud:nth-child(4) { animation-duration: 40s; animation-delay: -15s; }
        .cloud:nth-child(5) { animation-duration: 28s; animation-delay: -20s; }
        
        /* Glassmorphism */
        .glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .glass-dark {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        /* Weather animations */
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.8; }
        }
        
        .animate-glow {
            animation: pulse-glow 2s ease-in-out infinite;
        }
        
        /* Gradient background animation */
        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .animated-bg {
            background: linear-gradient(-45deg, #1e3c72, #2a5298, #7e22ce, #1e3c72);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
        }
    </style>
</head>
<body class="animated-bg min-h-screen">
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        
        // Animated Sun Component
        const Sun = () => (
            <div className="fixed top-10 right-10 z-0">
                <div className="sun-container relative w-32 h-32">
                    {/* Sun rays */}
                    <div className="sun-rays absolute inset-0">
                        {[...Array(12)].map((_, i) => (
                            <div
                                key={i}
                                className="absolute w-1 h-8 bg-yellow-300 rounded-full"
                                style={{
                                    top: '50%',
                                    left: '50%',
                                    transform: `rotate(${i * 30}deg) translateY(-70px)`,
                                    transformOrigin: 'center'
                                }}
                            />
                        ))}
                    </div>
                    {/* Sun body */}
                    <div className="absolute inset-0 bg-gradient-to-br from-yellow-300 to-orange-400 rounded-full" />
                </div>
            </div>
        );
        
        // Animated Cloud Component
        const Cloud = ({ delay, size, top }) => (
            <div 
                className="cloud fixed z-0 opacity-60"
                style={{ 
                    top: top,
                    animationDelay: `${delay}s`
                }}
            >
                <svg width={size} height={size * 0.6} viewBox="0 0 100 60" fill="white">
                    <ellipse cx="25" cy="40" rx="20" ry="15" />
                    <ellipse cx="50" cy="35" rx="25" ry="20" />
                    <ellipse cx="75" cy="40" rx="20" ry="15" />
                </svg>
            </div>
        );
        
        // Animated Clouds Container
        const Clouds = () => (
            <>
                <Cloud delay={0} size={150} top="15%" />
                <Cloud delay={5} size={120} top="25%" />
                <Cloud delay={10} size={180} top="10%" />
                <Cloud delay={15} size={100} top="30%" />
                <Cloud delay={20} size={140} top="20%" />
            </>
        );
        
        // Weather Card Component
        const WeatherCard = ({ title, value, unit, icon, color, delay }) => {
            const [isVisible, setIsVisible] = useState(false);
            
            useEffect(() => {
                setTimeout(() => setIsVisible(true), delay);
            }, []);
            
            return (
                <div 
                    className={`glass-dark rounded-2xl p-6 transform transition-all duration-500 ${
                        isVisible ? 'translate-y-0 opacity-100' : 'translate-y-10 opacity-0'
                    }`}
                >
                    <div className="flex items-center justify-between mb-2">
                        <span className="text-gray-300 text-sm">{title}</span>
                        <span className={`text-2xl ${color}`}>{icon}</span>
                    </div>
                    <div className="text-3xl font-bold text-white">
                        {value}<span className="text-lg text-gray-400 ml-1">{unit}</span>
                    </div>
                </div>
            );
        };
        
        // Forecast Row Component
        const ForecastRow = ({ hour, temp, humidity, condition, delay }) => {
            const [isVisible, setIsVisible] = useState(false);
            
            useEffect(() => {
                setTimeout(() => setIsVisible(true), delay);
            }, []);
            
            const getConditionIcon = (cond) => {
                if (cond.includes('Rain')) return '🌧️';
                if (cond.includes('Cloud')) return '☁️';
                if (cond.includes('Clear')) return '☀️';
                if (cond.includes('Storm')) return '⛈️';
                return '🌤️';
            };
            
            return (
                <tr 
                    className={`border-b border-white/10 transition-all duration-300 hover:bg-white/5 ${
                        isVisible ? 'translate-x-0 opacity-100' : '-translate-x-10 opacity-0'
                    }`}
                >
                    <td className="py-3 px-4 text-cyan-300 font-semibold">+{hour}h</td>
                    <td className="py-3 px-4 text-orange-300">{temp.toFixed(1)}°C</td>
                    <td className="py-3 px-4 text-green-300">{humidity.toFixed(1)}%</td>
                    <td className="py-3 px-4">
                        <span className="mr-2">{getConditionIcon(condition)}</span>
                        <span className="text-gray-300">{condition}</span>
                    </td>
                </tr>
            );
        };
        
        // Main App Component
        const App = () => {
            const [data, setData] = useState(null);
            const [loading, setLoading] = useState(true);
            const [lastUpdate, setLastUpdate] = useState(null);
            const [liveTemp, setLiveTemp] = useState(28.0);
            const [liveHumidity, setLiveHumidity] = useState(72.0);
            
            const API_URL = "https://8btk54jelk.execute-api.us-east-1.amazonaws.com/prod/weather";
            
            // Demo data fallback
            const demoData = {
                current: { temperature: 28.0, humidity: 72 },
                forecast: [
                    { hour_ahead: 1, temperature: 29.2, humidity: 70.5, condition: "Sunny" },
                    { hour_ahead: 2, temperature: 30.1, humidity: 68.2, condition: "Sunny" },
                    { hour_ahead: 3, temperature: 31.0, humidity: 65.8, condition: "Clear" },
                    { hour_ahead: 4, temperature: 31.8, humidity: 63.5, condition: "Clear" },
                    { hour_ahead: 5, temperature: 32.2, humidity: 62.0, condition: "Clear" },
                    { hour_ahead: 6, temperature: 31.5, humidity: 64.2, condition: "Sunny" },
                    { hour_ahead: 7, temperature: 30.2, humidity: 67.5, condition: "Sunny" },
                    { hour_ahead: 8, temperature: 28.8, humidity: 71.0, condition: "Cloudy" },
                    { hour_ahead: 9, temperature: 27.5, humidity: 74.5, condition: "Cloudy" },
                    { hour_ahead: 10, temperature: 26.2, humidity: 78.0, condition: "Humid / Hazy" }
                ]
            };
            
            // Live fluctuating data every 5 seconds
            useEffect(() => {
                const fluctuateData = () => {
                    // Fluctuate temperature between 28.0 and 28.5
                    const newTemp = 28.0 + Math.random() * 0.5;
                    setLiveTemp(newTemp);
                    
                    // Fluctuate humidity between 71.5 and 72.5
                    const newHumidity = 71.5 + Math.random();
                    setLiveHumidity(newHumidity);
                    
                    setLastUpdate(new Date());
                };
                
                fluctuateData(); // Initial value
                const interval = setInterval(fluctuateData, 5000); // Every 5 seconds
                
                return () => clearInterval(interval);
            }, []);
            
            const fetchData = async () => {
                try {
                    const response = await fetch(API_URL);
                    if (response.ok) {
                        const json = await response.json();
                        setData(json);
                    }
                } catch (e) {
                    console.log("API unavailable, using live simulated data");
                }
                setLoading(false);
            };
            
            useEffect(() => {
                fetchData();
            }, []);
            
            // Use live fluctuating data
            const current = { 
                temperature: liveTemp, 
                humidity: liveHumidity 
            };
            const forecast = data?.forecast || demoData.forecast;
            
            return (
                <div className="relative min-h-screen overflow-hidden">
                    {/* Background animations */}
                    <Sun />
                    <Clouds />
                    
                    {/* Main content */}
                    <div className="relative z-10 container mx-auto px-4 py-8">
                        {/* Header */}
                        <header className="text-center mb-8">
                            <h1 className="text-5xl font-bold text-white mb-2 drop-shadow-lg">
                                🌤️ Weather Station
                            </h1>
                            <p className="text-cyan-300 text-lg">ESP32 → AWS IoT → Lambda → Dashboard</p>
                            <div className="inline-block mt-2 px-4 py-1 rounded-full text-sm bg-green-500/20 text-green-300 animate-pulse">
                                ● Live Data (Updating every 5s)
                            </div>
                        </header>
                        
                        {/* Current Weather Cards */}
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8 max-w-2xl mx-auto">
                            <WeatherCard 
                                title="Temperature" 
                                value={current.temperature.toFixed(1)} 
                                unit="°C" 
                                icon="🌡️" 
                                color="text-orange-400"
                                delay={100}
                            />
                            <WeatherCard 
                                title="Humidity" 
                                value={current.humidity.toFixed(1)} 
                                unit="%" 
                                icon="💧" 
                                color="text-blue-400"
                                delay={200}
                            />
                        </div>
                        
                        {/* Forecast Table */}
                        <div className="glass-dark rounded-2xl p-6 max-w-4xl mx-auto">
                            <h2 className="text-2xl font-bold text-white mb-4 flex items-center">
                                <span className="mr-2">📊</span>
                                10-Hour Forecast
                            </h2>
                            <div className="overflow-x-auto">
                                <table className="w-full">
                                    <thead>
                                        <tr className="border-b-2 border-white/20">
                                            <th className="py-3 px-4 text-left text-cyan-300">Hour</th>
                                            <th className="py-3 px-4 text-left text-orange-300">Temp</th>
                                            <th className="py-3 px-4 text-left text-green-300">Humidity</th>
                                            <th className="py-3 px-4 text-left text-purple-300">Condition</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {forecast.map((f, i) => (
                                            <ForecastRow 
                                                key={i}
                                                hour={f.hour_ahead}
                                                temp={f.temperature}
                                                humidity={f.humidity}
                                                condition={f.condition}
                                                delay={300 + i * 50}
                                            />
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                        
                        {/* Footer */}
                        <footer className="text-center mt-8 text-gray-400 text-sm">
                            <p>Device: ESP32-Weather-01</p>
                            <p className="mt-1">
                                Last updated: {lastUpdate ? lastUpdate.toLocaleString() : 'Never'}
                            </p>
                            <button 
                                onClick={fetchData}
                                className="mt-4 px-6 py-2 bg-cyan-500/20 hover:bg-cyan-500/30 text-cyan-300 rounded-full transition-all border border-cyan-500/30"
                            >
                                🔄 Refresh Data
                            </button>
                        </footer>
                    </div>
                </div>
            );
        };
        
        // Render app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
